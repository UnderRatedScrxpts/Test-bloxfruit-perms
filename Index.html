<!-- language: HTML/CSS/JS, file: index.html, target: Local/Hosting -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Bazaar — Custom Link Hub</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --card-hover: #1e293b;
            --input-bg: #0d1117;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #60a5fa, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            background-color: var(--card-hover);
        }

        .card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 0 auto 10px auto;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
        }

        .card h3 {
            margin: 0 0 4px 0;
            font-size: 1rem;
            color: #ffffff;
        }

        .category-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .link-config {
            text-align: left;
            margin-bottom: 12px;
        }

        .link-config label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .link-config input {
            width: 100%;
            padding: 6px 8px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 4px;
            font-size: 0.8rem;
            box-sizing: border-box;
            font-family: monospace;
            margin-bottom: 6px;
        }

        .link-config input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

        <p class="subtitle">Customize your Spoofed URL, primary URL, and target link for each item.</p>
    </header>

    <div class="filter-container">
        <button class="filter-btn active" onclick="filterItems('all', event)">All Items</button>
        <button class="filter-btn" onclick="filterItems('Permanent', event)">Permanent Fruits</button>
        <button class="filter-btn" onclick="filterItems('Mutation', event)">Rare Mutations</button>
        <button class="filter-btn" onclick="filterItems('Gamepass', event)">Gamepasses</button>
        <button class="filter-btn" onclick="filterItems('Physical', event)">Rare Physicals</button>

            { name: "Celestial Pain (Physical)", category: "Physical", img: "https://static.wikia.nocookie.net/roblox-blox-fruits/images/0/07/Pain.png", spoofed: "https://web.roblox.com/item/celestial-pain", url1: "https://www.roblox.com", url2: "https://www.roblox.com" }
        ];

        function renderGrid(filter = 'all') {
            const grid = document.getElementById('itemGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? inventory : inventory.filter(i => i.category === filter);

            filtered.forEach((item, index) => {
                const globalIndex = inventory.indexOf(item);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80?text=Item'">
                        <h3>${item.name}</h3>
                        <div class="category-tag">${item.category}</div>

                        <div class="link-config">
                            <label>Spoofed url</label>
                            <input type="text" id="spoofed-${globalIndex}" value="${item.spoofed}">
                            
                            <label>Url</label>
                            <input type="text" id="url1-${globalIndex}" value="${item.url1}">
                            
                            <label>Url</label>
                            <input type="text" id="url2-${globalIndex}" value="${item.url2}">
                        </div>
                    </div>
                    <button class="btn" onclick="openTab(${globalIndex})">Claim</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterItems(category, event) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderGrid(category);
        }

        function openTab(index) {
            const spoofedVal = document.getElementById(`spoofed-${index}`).value;
            const url1Val = document.getElementById(`url1-${index}`).value;
            const url2Val = document.getElementById(`url2-${index}`).value;

            const tabWindow = window.open("", "_blank", "width=950,height=700");
            tabWindow.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>Claim Portal — Tab Viewer</title>
                    <style>
                        body, html { margin: 0; padding: 0; height: 100%; background: #0b0f19; font-family: sans-serif; display: flex; flex-direction: column; }
                        .url-bar-container { background-color: #161b22; padding: 10px 14px; border-bottom: 1px solid #30363d; display: flex; flex-direction: column; gap: 6px; font-family: monospace; font-size: 12px; color: #f0f6fc; flex-shrink: 0; }
                        .row { display: flex; align-items: center; gap: 10px; background: #0d1117; padding: 6px 10px; border-radius: 4px; border: 1px solid #30363d; }
                        .row span.label { color: #8b949e; width: 90px; font-weight: bold; }
                        .row a { color: #58a6ff; text-decoration: none; word-break: break-all; }
                        .row a:hover { text-decoration: underline; }
                        iframe { flex-grow: 1; border: none; width: 100%; background: #ffffff; }
                    </style>
                </head>
                <body>
                    <div class="url-bar-container">
                        <div class="row">
                            <span class="label">Spoofed url</span>
                            <span>🔒 ${spoofedVal}</span>
                        </div>
                        <div class="row">
                            <span class="label">Url</span>
                            <a href="${url1Val}" target="_blank">${url1Val}</a>
                        </div>
                        <div class="row">
                            <span class="label">Url</span>
                            <a href="${url2Val}" target="_blank">${url2Val}</a>
                        </div>
                    </div>
                    <iframe src="${url2Val}"></iframe>
                </body>
                </html>
            `);
        }

        renderGrid('all');
    </script>
</body>
